# File operations exclusions ? comma-separated list
# Used only for initialization when creating a new project.
# After that, user's changes in DB take effect.
fileops.exclusions=.git,.idea,.gradle,.vscode,.veai,node_modules,build,target,dist,out,.env,*.key,*.pem,*.p12,*.jks,*.keystore
# LLM configuration defaults (override in ~/.ai-challenge/week-6/app.properties or via LLM_* env vars)
# llm.baseUrl=http://localhost:11434/v1
# llm.apiKey=ollama
# llm.model=qwen2.5:7b
# Embedding configuration defaults (override in ~/.ai-challenge/week-6/app.properties)
# Provider: ollama | openai (including OpenAI-compatible APIs)
