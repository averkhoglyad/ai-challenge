# AI Challenge - default configuration (bundled in JAR)
#
# DO NOT put real secrets here - this file is part of the project.
# Override values via external config files:
#   ~/.ai-challenge/application.properties   (user-level)
#   ./application.properties                 (project-level)
#   ./config/application.properties          (project config dir)
#   --config=/path/to/file.properties        (CLI argument)
# API Configuration
#api.base-url=https://routerai.ru/api
#api.key=YOUR_API_KEY_HERE
#api.model=deepseek/deepseek-v4-flash:DeepSeek V4 Flash(9,18)
# Timeout Configuration (ISO-8601 duration format)
# Examples: PT15S (15 seconds), PT1M (1 minute), PT30S (30 seconds)
api.connect-timeout=PT30S
api.request-timeout=PT60S
# Context window limit for default model (tokens)
api.context-window=16384
models=deepseek/deepseek-v4-flash:DeepSeek V4 Flash(9,18),minimax/minimax-m3:Minimax M3(28,114),openai/gpt-4o-mini:GPT-4o Mini(14,57),openai/gpt-4o:GPT-4o(238,955),deepseek/deepseek-v4-pro:DeepSeek V4 Pro(63,126),qwen/qwen3.7-plus:Qwen3.7 Plus(38,152),qwen/qwen3.7-max:Qwen3.7 Max(119,358),anthropic/claude-opus-4.8:Claude Opus 4.8(477,2387),anthropic/claude-sonnet-4.6:Claude Sonnet 4.6(286,1432),openai/gpt-5.5:GPT-5.5(477,2865)
# Rate limiting for API requests
# Controls request throttling to avoid API rate limit errors
api.rate-limit.enabled=true
api.rate-limit.min-interval=PT0.5S
api.rate-limit.max-requests-per-minute=60
# === LLM settings ===================================================
# Token estimation (chars per token, approximate)
llm.token-estimate-chars-per-token=4
# === Context Compression (Task 4) ====================================
# Controls context compression for long dialogs.
# When enabled, old messages are summarized to save tokens.
context.compression.enabled=false
context.compression.window-size=10
context.compression.block-size=5
# context.compression.summary-model-id=optional-model-id
# === Memory (STM) ===================================================
memory.stm.window-size=20
# === Document Indexer ==============================================
# Embedding provider: ollama | openai (includes any OpenAI-compatible API)
indexer.embedding.provider=ollama
indexer.embedding.batch.size=16
indexer.embedding.timeout.seconds=60
indexer.embedding.retry.attempts=3
indexer.embedding.retry.initial.delay.ms=1000
# Native Ollama
indexer.embedding.ollama.url=http://localhost:11434
indexer.embedding.ollama.model=nomic-embed-text
# OpenAI and OpenAI-compatible API
indexer.embedding.openai.url=https://api.openai.com/v1/embeddings
indexer.embedding.openai.model=text-embedding-3-small
indexer.embedding.openai.api-key=
# Chunking defaults
indexer.chunk.size=500
indexer.chunk.overlap=50
indexer.chunk.max-section-length=2000
# === External Services (Task3) =======================================
# === RAG (Retrieval-Augmented Generation) =============================
# Default search configuration loaded at startup.
# Can be overridden at runtime via CLI: :rag mode/threshold/topk
rag.search.mode=filtered
rag.search.top-k-initial=50
rag.search.top-k-final=5
rag.search.threshold=0.75
# === Anti-hallucination (Task 4) ====================================
rag.anti-hallucination.relevance-threshold=0.70
rag.anti-hallucination.max-citations=5
rag.anti-hallucination.min-citations=1
# === Reranker settings (Task 3) =====================================
reranker.fallback-score=5.0
reranker.normalization-divisor=10.0
reranker.chunk-text-limit=300
# === Planner settings (Task 3) ======================================
planner.temperature=0.7
planner.max-tokens=2000
# === Benchmark defaults =============================================
benchmark.default-temperatures=0.0,0.7,1.2
benchmark.max-tokens=500

services.events.base-url=http://localhost:8080
services.notifications.base-url=http://localhost:8082
services.weather.base-url=http://localhost:8081
services.http.connect-timeout=3
services.http.read-timeout=10
# === Chat Configuration (Task 5) ===================================
# History window size ? number of recent messages sent to LLM
chat.history.window-size=6
# Maximum length of auto-generated chat name
chat.name.max-length=50
# Enable automatic chat name generation on first exchange
chat.auto-name.enabled=true
# === Task State Extraction (Task 5) ================================
# Enable automatic task state extraction from chat messages
task-state.extraction.enabled=true
# Maximum number of domain terms in task state
task-state.extraction.max-terms=50
# Maximum number of constraints in task state
task-state.extraction.max-constraints=50
# Maximum number of clarified facts in task state
task-state.extraction.max-clarified-facts=50
