# AI Challenge - default configuration (bundled in JAR)
#
# DO NOT put real secrets here ? this file is part of the project.
# Override values via external config files:
#   ~/.ai-challenge/application.properties   (user-level)
#   ./application.properties                 (project-level)
#   ./config/application.properties          (project config dir)
#   --config=/path/to/file.properties        (CLI argument)

# API Configuration
#api.base-url=https://routerai.ru/api
#api.key=YOUR_API_KEY_HERE
#api.model=minimax/minimax-m3

# Timeout Configuration (ISO-8601 duration format)
# Examples: PT15S (15 seconds), PT1M (1 minute), PT30S (30 seconds)
api.connect-timeout=PT30S
api.request-timeout=PT60S

# Rate limiting for API requests
# Controls request throttling to avoid API rate limit errors
api.rate-limit.enabled=true
api.rate-limit.min-interval=PT0.5S
api.rate-limit.max-requests-per-minute=60
