# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.4.0"
uuidCreator = "6.0.0"
kotlinxSerializationJSON = "1.9.0"
kotlinxCoroutines = "1.10.2"
mordant = "3.0.1"
springBoot = "4.1.0"
springAi = "2.0.0"
springDependencyManagement = "1.1.7"
ktor = "3.5.1"
caffeine = "3.1.8"
exposed = "0.55.0"
sqliteJdbc = "3.46.0.0"
mockk = "1.13.12"
kotest = "5.9.1"
kotestExtensionsSpring = "1.3.0"
kotlinxDatetime = "0.6.1"
mcpSdk = "0.13.0"
springBootTest = "4.1.0"
springFramework = "7.0.8"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-jdk8 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-jdk8", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesReactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor", version.ref = "kotlinxCoroutines" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
mordant = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }

# Testing — Kotest
kotestRunnerJunit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotestAssertionsCore = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotestProperty = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotestExtensionsSpring = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotestExtensionsSpring" }

# Spring AI
springAiBom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
springAiMcpServerWebmvc = { module = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc", version.ref = "springAi" }

# Ktor Client
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorSerializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktorClientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

# MCP SDK
mcpSdkClient = { module = "io.modelcontextprotocol:kotlin-sdk-client", version.ref = "mcpSdk" }

# Cache (in-memory)
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# Exposed (Kotlin SQL framework)
exposedCore = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposedDao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposedJdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposedKotlinDatetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }

# SQLite
sqliteJdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

# Mocking
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
uuidCreator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }

# Spring Test (for shared test modules without Spring Boot plugin)
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBootTest" }
springJdbc = { module = "org.springframework:spring-jdbc", version.ref = "springFramework" }

# Libraries can be bundled together for easier import
[bundles]
kotlinxEcosystem = ["kotlinxSerialization", "kotlinxCoroutines"]

[plugins]
kotlinPluginSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
